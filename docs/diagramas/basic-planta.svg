<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="title desc">
<title id="title">Campo Basic — planta extraída do executável</title><desc id="desc">Dez vértices em duas superfícies planas, ligadas na aresta vertical x igual a 100. Partida em menos 250, zero e alvo em 200, zero. Eixo y positivo para cima.</desc>
<rect width="780" height="380" fill="#fafafa"/>
<g font-family="sans-serif" fill="#17202a"><text x="28" y="30" font-size="20">Basic — planta em coordenadas do campo</text><text x="28" y="53" font-size="13">Todos os vértices: z = 10. Geometria extraída; não é captura do jogo.</text></g>
<g transform="translate(390 205) scale(1 -1)" stroke-width="2">
<path d="M-300 50 L100 50 L100 -50 L-300 -50 Z" fill="#d1e7d9" stroke="#28583d"/>
<path d="M150 100 L250 100 L300 50 L300 -50 L250 -100 L150 -100 L100 -50 L100 50 Z" fill="#b7d7c5" stroke="#28583d"/>
<path d="M100 50 V-50" stroke="#2073ba" stroke-width="4" stroke-dasharray="7 5"/>
<path d="M-250 0 H200" stroke="#718096" stroke-dasharray="5 5"/>
<circle cx="-250" cy="0" r="6" fill="#fff" stroke="#222"/><circle cx="200" cy="0" r="7" fill="#222"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#17202a">
<text x="68" y="145">1 (-300,50)</text><text x="448" y="145">2 (100,50)</text><text x="448" y="273">3 (100,-50)</text><text x="60" y="273">4 (-300,-50)</text>
<text x="503" y="95">5 (150,100)</text><text x="618" y="95">6 (250,100)</text><text x="695" y="157">7</text><text x="695" y="260">8</text>
<text x="615" y="325">9 (250,-100)</text><text x="502" y="325">10 (150,-100)</text>
<text x="114" y="229">partida</text><text x="574" y="229">alvo</text><text x="253" y="185">superfície 1</text><text x="552" y="185">superfície 2</text>
<text x="28" y="350">Linha azul: passagem 1 ↔ 2; demais arestas: ligação zero (parede).</text><text x="28" y="370">x aumenta para a direita; y aumenta para cima. Escala 1 unidade por pixel nesta planta.</text>
</g></svg>
