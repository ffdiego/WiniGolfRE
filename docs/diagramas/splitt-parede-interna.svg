<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="title desc"><title id="title">Splitt: parede interna em L</title><desc id="desc">Parede horizontal entre os vértices 6 e 11, de menos 200 a 100 em y 200, e vertical entre 11 e 10 em x 100 de y 200 a 250. O vértice 7 não é usado.</desc><rect width="780" height="650" fill="#fafafa"/>
<g font-family="sans-serif" fill="#17202a"><text x="25" y="30" font-size="22">Splitt — parede interna em L</text><text x="25" y="53" font-size="13">Planta x/y; todos os vértices conhecidos têm z=10. Vértice 7 não utilizado.</text></g>
<g transform="translate(390 380) scale(1 -1)" fill="#d4e7dd" stroke="#466454" stroke-width="2">
<polygon points="-300,150 -200,150 -200,-200 -300,-200"/><polygon points="-300,200 -200,200 -200,150 -300,150"/><polygon points="-250,250 -200,250 -200,200 -300,200"/><polygon points="-200,250 100,250 100,200 -200,200"/><polygon points="-200,200 100,200 100,150 -200,150"/><polygon points="150,300 250,300 300,250 300,200 100,200 100,250"/><polygon points="100,200 300,200 300,150 250,100 150,100 100,150"/>
<path d="M-200 150H-300 M-300 200H-200 M-200 200V150 M-200 250V200 M100 200V150 M100 200H300" fill="none" stroke="#2683b7" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M-200 200H100V250" fill="none" stroke="#c23e30" stroke-width="6" stroke-linejoin="round"/>
<circle cx="-250" cy="-150" r="6" fill="white" stroke="#222"/><circle cx="200" cy="200" r="7" fill="#222"/>
</g><g font-family="sans-serif" font-size="14" fill="#17202a"><text x="208" y="155">4: corredor sem saída direta</text><text x="230" y="222">5: caminho para o alvo</text><text x="506" y="123">6</text><text x="573" y="228">7: área final</text><text x="127" y="442">1: partida</text><text x="87" y="203">2</text><text x="130" y="146">3</text><text x="165" y="171">6</text><text x="494" y="174">11</text><text x="494" y="121">10</text><text x="25" y="610">Vermelho: paredes internas (ligação zero dos dois lados). Azul: passagens.</text><text x="25" y="634">Os números grandes indicam superfícies; 6, 11 e 10 junto à parede são IDs dos vértices.</text></g></svg>
